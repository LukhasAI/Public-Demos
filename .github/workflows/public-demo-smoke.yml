name: Public demo smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Real subprocess smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax of actual showcase entrypoints
        run: python -m py_compile showcase_interactive.py run_demo_safely.py
      - name: Launch real CLI flows
        run: python -m unittest discover -s tests -v
